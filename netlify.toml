[build]
  base = "apps/platform"
  command = "npm run build:netlify"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NPM_VERSION = "10"

[context.deploy-preview]
  command = "npm run build:netlify"

[context.branch-deploy]
  command = "npm run build:netlify"

# Preserve the verified public game URLs while their Vite bundles remain
# independent from the Next.js platform shell. Specific rules must precede
# the Next runtime's generated catch-all routes.
[[redirects]]
  from = "/voidavoid"
  to = "/VOIDaVOID/"
  status = 301

[[redirects]]
  from = "/voidavoid/*"
  to = "/VOIDaVOID/:splat"
  status = 200

[[redirects]]
  from = "/wreckavoid"
  to = "/WreckaVOID/"
  status = 301

[[redirects]]
  from = "/wreckavoid/*"
  to = "/WreckaVOID/:splat"
  status = 200

[[redirects]]
  from = "/wordavoid"
  to = "/WORDaVOID/"
  status = 301

[[redirects]]
  from = "/wordavoid/*"
  to = "/WORDaVOID/:splat"
  status = 200

[[headers]]
  for = "/VOIDaVOID/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/WreckaVOID/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/WORDaVOID/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/games/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/avoid-hero.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
