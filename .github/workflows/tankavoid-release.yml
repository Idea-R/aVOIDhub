name: TankaVOID release candidate

on:
  pull_request:
    paths:
      - ".github/workflows/tankavoid-release.yml"
      - "apps/platform/**"
      - "games/tanka-void/**"
      - "packages/tankavoid-contract/**"
      - "supabase/**"
      - "netlify.toml"
      - "package.json"
      - "package-lock.json"
      - "tools/verify-tankavoid-release.mjs"
      - "tools/verify-platform-efficiency.mjs"
      - "tools/build-platform-games.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tankavoid-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify:tankavoid:release
      - name: Verify team authorization and concurrent invitations locally
        shell: bash
        run: |
          teams_pg_initdb="$(find /usr/lib/postgresql -type f -name initdb -print | sort -V | tail -n 1)"
          test -n "$teams_pg_initdb"
          TEAMS_TEST_PG_BIN="$(dirname "$teams_pg_initdb")" node supabase/tests/verify-platform-teams.mjs
